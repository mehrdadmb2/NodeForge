<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V2Ray Config Renamer Pro - Web Edition</title>
    <style>
        /* ===== RESET & BASE ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --text-primary: #ffffff;
            --text-secondary: #b0b0c8;
            --accent-1: #6c5ce7;
            --accent-2: #00cec9;
            --accent-3: #fd79a8;
            --success: #00b894;
            --danger: #d63031;
            --warning: #fdcb6e;
            --info: #0984e3;
            --radius: 16px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
        }

        .bg-animation .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.35;
            animation: float 20s infinite ease-in-out;
        }

        .blob-1 {
            width: 400px;
            height: 400px;
            background: #6c5ce7;
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .blob-2 {
            width: 300px;
            height: 300px;
            background: #00cec9;
            bottom: -50px;
            right: -50px;
            animation-delay: -7s;
        }

        .blob-3 {
            width: 250px;
            height: 250px;
            background: #fd79a8;
            top: 40%;
            left: 70%;
            animation-delay: -14s;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(30px, -50px) scale(1.1);
            }
            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }
            100% {
                transform: translate(0, 0) scale(1);
            }
        }

        /* Main Container */
        .app-container {
            width: 100%;
            max-width: 1400px;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        /* Glass Card */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            box-shadow: var(--glass-shadow);
            padding: 25px;
            margin-bottom: 20px;
            transition: var(--transition);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .glass-card:hover {
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            border-color: rgba(255, 255, 255, 0.25);
        }

        /* Header */
        .app-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .app-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(45deg, #a29bfe, #81ecec, #fd79a8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            margin-bottom: 8px;
        }

        .app-header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 12px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            backdrop-filter: blur(5px);
        }

        .tab-btn.active,
        .tab-btn:hover {
            background: linear-gradient(135deg, #6c5ce7, #00cec9);
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
            transform: translateY(-2px);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Input/Output Areas */
        .textarea-wrapper {
            position: relative;
            margin-bottom: 15px;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-primary);
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.95rem;
            resize: vertical;
            min-height: 180px;
            transition: var(--transition);
        }

        textarea:focus {
            outline: none;
            border-color: #6c5ce7;
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.2);
        }

        .btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(5px);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, #6c5ce7, #00cec9);
            border: none;
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #00b894, #00cec9);
            border: none;
        }

        .btn-danger {
            background: linear-gradient(135deg, #d63031, #fd79a8);
            border: none;
        }

        .btn-warning {
            background: linear-gradient(135deg, #fdcb6e, #e17055);
            border: none;
            color: #333;
        }

        .btn-info {
            background: linear-gradient(135deg, #0984e3, #6c5ce7);
            border: none;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* Settings Grid */
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .setting-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .setting-item label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .setting-item input,
        .setting-item select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-primary);
            transition: var(--transition);
        }

        .setting-item input:focus,
        .setting-item select:focus {
            outline: none;
            border-color: #6c5ce7;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #6c5ce7;
        }

        /* Progress */
        .progress-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }

        .progress-bar {
            flex: 1;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6c5ce7, #00cec9);
            border-radius: 20px;
            transition: width 0.3s ease;
        }

        .progress-stats {
            font-size: 0.85rem;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        /* Stats Summary */
        .stats-summary {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
            font-size: 0.9rem;
            white-space: pre-wrap;
        }

        .country-group {
            margin-top: 10px;
            padding: 10px;
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            background: rgba(255,255,255,0.02);
        }

        .country-group h4 {
            margin-bottom: 5px;
        }

        .country-list {
            list-style-type: none;
            padding-left: 0;
        }

        .country-list li {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
        }

        /* Preview Table */
        .preview-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .preview-table th,
        .preview-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid var(--glass-border);
            font-size: 0.85rem;
        }

        .preview-table th {
            background: rgba(255, 255, 255, 0.05);
            font-weight: 600;
        }

        /* GitHub Tab */
        .github-url-field {
            display: flex;
            gap: 10px;
        }

        .github-url-field input {
            flex: 1;
        }

        .mode-options {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .mode-option {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .app-container {
                padding: 10px;
            }
            .app-header h1 {
                font-size: 1.8rem;
            }
            .settings-grid {
                grid-template-columns: 1fr;
            }
            .btn-row {
                flex-direction: column;
            }
            .progress-container {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-animation">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="app-container">
        <!-- Header -->
        <div class="app-header">
            <h1>🌐 V2Ray Config Renamer Pro</h1>
            <p>Web Edition - Modern & Responsive</p>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="inputOutput">📥 Input / Output</button>
            <button class="tab-btn" data-tab="settings">⚙️ Settings</button>
            <button class="tab-btn" data-tab="github">🚀 GitHub</button>
            <button class="tab-btn" data-tab="log">📋 Log</button>
        </div>

        <!-- Tab: Input / Output -->
        <div class="tab-content active" id="tab-inputOutput">
            <div class="glass-card">
                <h3>Input Links</h3>
                <div class="textarea-wrapper">
                    <textarea id="inputText" placeholder="Paste your V2Ray config links here, one per line..."></textarea>
                </div>
                <div class="btn-row">
                    <button class="btn" onclick="loadFile()">📂 Load File</button>
                    <button class="btn" onclick="pasteClipboard()">📋 Paste from Clipboard</button>
                    <button class="btn" onclick="fetchSubscription()">🌐 Fetch Subscription</button>
                    <button class="btn" onclick="clearInput()">🗑️ Clear</button>
                </div>
            </div>

            <div class="glass-card">
                <h3>Naming Settings</h3>
                <div class="settings-grid">
                    <div class="setting-item">
                        <label>Prefix</label>
                        <input type="text" id="prefix" value="Node-">
                    </div>
                    <div class="setting-item">
                        <label>Start Number</label>
                        <input type="number" id="startNum" value="0">
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="addTimestamp">
                        <label for="addTimestamp">Add Date/Time</label>
                    </div>
                    <div class="setting-item">
                        <label>Date Format</label>
                        <select id="dateFormat">
                            <option value="YYYYMMDD_HHMMSS">YYYYMMDD_HHMMSS</option>
                            <option value="YYYY-MM-DD HH:MM:SS">YYYY-MM-DD HH:MM:SS</option>
                            <option value="DD/MM/YYYY HH:MM">DD/MM/YYYY HH:MM</option>
                            <option value="Unix">Unix Timestamp</option>
                        </select>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="addFlag">
                        <label for="addFlag">Add Country Flag (GeoIP)</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="preserveCountry">
                        <label for="preserveCountry">Preserve Original Country/Flag</label>
                    </div>
                    <div class="setting-item">
                        <label>Country Position</label>
                        <select id="countryPos">
                            <option value="prefix">At Beginning</option>
                            <option value="suffix">At End</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="glass-card">
                <div class="btn-row">
                    <button class="btn btn-primary" id="runBtn" onclick="startProcessing()">⚡ Start Processing</button>
                    <button class="btn btn-warning" id="pauseBtn" onclick="togglePause()" disabled>⏸️ Pause</button>
                    <button class="btn btn-danger" id="cancelBtn" onclick="cancelProcessing()" disabled>⏹️ Cancel</button>
                </div>
                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <span class="progress-stats" id="progressStats">0%</span>
                </div>
            </div>

            <div class="glass-card">
                <h3>Output</h3>
                <div class="textarea-wrapper">
                    <textarea id="outputText" placeholder="Processed links will appear here..." readonly></textarea>
                </div>
                <div class="btn-row">
                    <button class="btn" onclick="exportOutput('txt')">💾 Save TXT</button>
                    <button class="btn" onclick="exportOutput('csv')">📊 Save CSV</button>
                    <button class="btn" onclick="exportOutput('json')">📦 Save JSON</button>
                    <button class="btn" onclick="copyOutput()">📋 Copy</button>
                    <button class="btn btn-info" onclick="uploadToGitHub()">🚀 Upload to GitHub</button>
                </div>
                <div class="stats-summary" id="statsSummary"></div>
            </div>
        </div>

        <!-- Tab: Settings -->
        <div class="tab-content" id="tab-settings">
            <div class="glass-card">
                <h3>General Settings</h3>
                <div class="settings-grid">
                    <div class="setting-item">
                        <label>Theme</label>
                        <select id="themeSelect" onchange="changeTheme(this.value)">
                            <option value="dark">Dark</option>
                            <option value="light">Light</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label>GeoIP Threads (concurrency)</label>
                        <input type="number" id="maxThreads" value="10" min="1" max="50">
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="removeDuplicates" checked>
                        <label for="removeDuplicates">Remove Duplicates</label>
                    </div>
                </div>
                <button class="btn btn-success" onclick="saveSettings()">💾 Save Settings</button>
            </div>
        </div>

        <!-- Tab: GitHub -->
        <div class="tab-content" id="tab-github">
            <div class="glass-card">
                <h3>GitHub Upload Configuration</h3>
                <div class="github-url-field">
                    <input type="text" id="githubUrl" placeholder="Paste GitHub URL (auto-detect)">
                    <button class="btn btn-info" onclick="detectGitHubUrl()">🔍 Detect</button>
                </div>
                <div class="settings-grid" style="margin-top:15px;">
                    <div class="setting-item">
                        <label>GitHub Token</label>
                        <input type="password" id="githubToken" placeholder="ghp_...">
                    </div>
                    <div class="setting-item">
                        <label>Repository (owner/repo)</label>
                        <input type="text" id="githubRepo" placeholder="mehrdadmb2/V2ray_Sub">
                    </div>
                    <div class="setting-item">
                        <label>File Path</label>
                        <input type="text" id="githubPath" placeholder="Mix.txt">
                    </div>
                    <div class="setting-item">
                        <label>Branch</label>
                        <input type="text" id="githubBranch" value="main">
                    </div>
                </div>
                <div class="mode-options" style="margin:15px 0;">
                    <span>Upload Mode:</span>
                    <label class="mode-option"><input type="radio" name="uploadMode" value="replace" checked> Replace file</label>
                    <label class="mode-option"><input type="radio" name="uploadMode" value="prepend"> Prepend</label>
                    <label class="mode-option"><input type="radio" name="uploadMode" value="append"> Append</label>
                </div>
                <div class="btn-row">
                    <button class="btn btn-primary" onclick="saveGitHubSettings()">💾 Save GitHub Settings</button>
                    <button class="btn btn-info" onclick="testGitHubConnection()">🔍 Test Connection</button>
                </div>
                <div id="githubStatus" style="margin-top:10px; font-weight:500;"></div>
            </div>
        </div>

        <!-- Tab: Log -->
        <div class="tab-content" id="tab-log">
            <div class="glass-card">
                <h3>Log</h3>
                <div class="textarea-wrapper">
                    <textarea id="logText" readonly style="min-height:300px;"></textarea>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== Global State =====
        let isProcessing = false;
        let isPaused = false;
        let cancelRequested = false;
        let processedCount = 0;
        let totalCount = 0;
        let startTime = 0;
        let configs = [];

        // ===== Utility Functions =====
        function log(message) {
            const logText = document.getElementById('logText');
            const timestamp = new Date().toLocaleTimeString();
            logText.value += `[${timestamp}] ${message}\n`;
            logText.scrollTop = logText.scrollHeight;
        }

        function updateStatus(message) {
            log(message);
            document.getElementById('githubStatus').textContent = message;
        }

        function formatDate(date, format) {
            const d = date;
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            const hours = String(d.getHours()).padStart(2, '0');
            const minutes = String(d.getMinutes()).padStart(2, '0');
            const seconds = String(d.getSeconds()).padStart(2, '0');

            switch(format) {
                case 'YYYYMMDD_HHMMSS':
                    return `${year}${month}${day}_${hours}${minutes}${seconds}`;
                case 'YYYY-MM-DD HH:MM:SS':
                    return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
                case 'DD/MM/YYYY HH:MM':
                    return `${day}/${month}/${year} ${hours}:${minutes}`;
                case 'Unix':
                    return Math.floor(d.getTime() / 1000);
                default:
                    return '';
            }
        }

        function countryCodeToFlag(code) {
            if (!code || code.length !== 2) return '';
            return String.fromCodePoint(...[...code.toUpperCase()].map(c => 127397 + c.charCodeAt(0)));
        }

        const COUNTRY_NAME_TO_CODE = {

        // Two-letter ISO code mapping
        const COUNTRY_CODE_MAP = {
            "US": "US", "GB": "GB", "UK": "GB", "DE": "DE", "NL": "NL", "FR": "FR",
            "CA": "CA", "JP": "JP", "SG": "SG", "SE": "SE", "CH": "CH", "FI": "FI",
            "NO": "NO", "DK": "DK", "IT": "IT", "ES": "ES", "AU": "AU", "NZ": "NZ",
            "BR": "BR", "IN": "IN", "RU": "RU", "CN": "CN", "TR": "TR", "IR": "IR",
            "AE": "AE", "SA": "SA", "IL": "IL", "KR": "KR", "HK": "HK", "TW": "TW",
            "ID": "ID", "MY": "MY", "TH": "TH", "VN": "VN", "PL": "PL", "AT": "AT",
            "BE": "BE", "CZ": "CZ", "IE": "IE", "PT": "PT", "GR": "GR", "RO": "RO",
            "BG": "BG", "HU": "HU", "SK": "SK", "SI": "SI", "HR": "HR", "RS": "RS",
            "UA": "UA", "LV": "LV", "LT": "LT", "EE": "EE", "LU": "LU", "IS": "IS",
            "CY": "CY", "MT": "MT", "MD": "MD", "GE": "GE", "AM": "AM", "AZ": "AZ",
            "KZ": "KZ", "UZ": "UZ", "KG": "KG", "TM": "TM", "TJ": "TJ", "AF": "AF",
            "PK": "PK", "BD": "BD", "LK": "LK", "NP": "NP", "BT": "BT", "MV": "MV",
            "MM": "MM", "LA": "LA", "KH": "KH", "BN": "BN", "PH": "PH", "MN": "MN",
            "KP": "KP", "EG": "EG", "LY": "LY", "TN": "TN", "DZ": "DZ", "MA": "MA",
            "SD": "SD", "SS": "SS", "ET": "ET", "SO": "SO", "KE": "KE", "UG": "UG",
            "RW": "RW", "BI": "BI", "TZ": "TZ", "MZ": "MZ", "ZM": "ZM", "ZW": "ZW",
            "BW": "BW", "NA": "NA", "ZA": "ZA", "NG": "NG", "GH": "GH", "CI": "CI",
            "SN": "SN", "ML": "ML", "BF": "BF", "NE": "NE", "TD": "TD", "CM": "CM",
            "GA": "GA", "CG": "CG", "CD": "CD", "AO": "AO", "MG": "MG", "MU": "MU",
            "SC": "SC", "CV": "CV", "ST": "ST", "GQ": "GQ", "CF": "CF", "BJ": "BJ",
            "TG": "TG", "LR": "LR", "SL": "SL", "GN": "GN", "GW": "GW", "GM": "GM",
            "MR": "MR", "EH": "EH", "ER": "ER", "DJ": "DJ", "KM": "KM", "LS": "LS",
            "SZ": "SZ", "MW": "MW"
        };

        function extractCountryFlagFromName(name) {
            if (!name) return '';
            // Flag emoji
            const flagMatch = name.match(/[\u{1F1E6}-\u{1F1FF}]{2}/u);
            if (flagMatch) return flagMatch[0];
            // Country name
            const lowerName = name.toLowerCase();
            for (const [country, code] of Object.entries(COUNTRY_NAME_TO_CODE)) {
                if (lowerName.includes(country)) {
                    const regex = new RegExp(`\\b${country}\\b`, 'i');
                    if (regex.test(lowerName)) {
                        return countryCodeToFlag(code);
                    }
                }
            }
            // Two-letter code (e.g., US, NL, HK)
            for (const [code, iso] of Object.entries(COUNTRY_CODE_MAP)) {
                const regex = new RegExp(`\\b${code}\\b`, 'i');
                if (regex.test(name)) {
                    return countryCodeToFlag(iso);
                }
            }
            return '';
        }

        function getProtocolType(link) {
            const low = link.toLowerCase();
            if (low.startsWith('vmess://')) return 'VMess';
            if (low.startsWith('vless://')) return 'VLESS';
            if (low.startsWith('trojan://')) return 'Trojan';
            if (low.startsWith('ss://')) return 'Shadowsocks';
            if (low.startsWith('hysteria2://')) return 'Hysteria2';
            if (low.startsWith('hysteria://')) return 'Hysteria';
            if (low.startsWith('tuic://')) return 'TUIC';
            if (low.startsWith('socks://')) return 'SOCKS';
            if (low.startsWith('http://') || low.startsWith('https://')) return 'HTTP';
            if (low.startsWith('ssh://')) return 'SSH';
            if (low.startsWith('wireguard://')) return 'WireGuard';
            if (low.startsWith('reality://')) return 'Reality';
            if (low.startsWith('grpc://')) return 'gRPC';
            return 'Other';
        }

        function extractHost(link) {
            link = link.trim();
            if (link.startsWith('vmess://')) {
                try {
                    let b64 = link.substring(8).replace(/^\/+/, '');
                    const missing = b64.length % 4;
                    if (missing) b64 += '='.repeat(4 - missing);
                    const decoded = atob(b64);
                    const cfg = JSON.parse(decoded);
                    return cfg.add || '';
                } catch (e) { return ''; }
            }
            try {
                const atIndex = link.indexOf('@');
                if (atIndex !== -1) {
                    const rest = link.substring(atIndex + 1);
                    let host = rest.split(':')[0].split('/')[0].split('?')[0].split('#')[0];
                    return host;
                }
            } catch (e) {}
            return '';
        }

        function getOldName(link) {
            if (link.includes('#')) {
                try {
                    // Decode percent-encoded name
                    return decodeURIComponent(link.split('#').pop());
                } catch (e) {}
            }
            if (link.startsWith('vmess://')) {
                try {
                    let b64 = link.substring(8).replace(/^\/+/, '');
                    b64 += '='.repeat((4 - b64.length % 4) % 4);
                    const decoded = atob(b64);
                    const cfg = JSON.parse(decoded);
                    return cfg.ps || '';
                } catch (e) {}
            }
            return '';
        }

        function renameLink(link, newName) {
            const low = link.toLowerCase();
            if (low.startsWith('vmess://')) {
                try {
                    let b64 = link.substring(8).replace(/^\/+/, '');
                    const missing = b64.length % 4;
                    if (missing) b64 += '='.repeat(4 - missing);
                    const decoded = atob(b64);
                    const cfg = JSON.parse(decoded);
                    cfg.ps = newName;
                    const newJson = JSON.stringify(cfg);
                    const newB64 = btoa(unescape(encodeURIComponent(newJson)));
                    return 'vmess://' + newB64;
                } catch (e) { return null; }
            } else if (low.startsWith('ss://')) {
                if (link.includes('#')) {
                    return link.substring(0, link.indexOf('#')) + '#' + encodeURIComponent(newName);
                } else {
                    return link + '#' + encodeURIComponent(newName);
                }
            } else {
                // URI protocols
                if (link.includes('#')) {
                    return link.substring(0, link.indexOf('#')) + '#' + encodeURIComponent(newName);
                } else {
                    return link + '#' + encodeURIComponent(newName);
                }
            }
        }

        // ===== GeoIP Resolution =====
        async function resolveGeoIP(host) {
            if (!host) return { code: '', flag: '' };
            // Check cache
            if (geoCache[host]) return geoCache[host];
            try {
                const response = await fetch(`https://ipwho.is/${host}`);
                if (response.ok) {
                    const data = await response.json();
                    const code = data.country_code || '';
                    const flag = countryCodeToFlag(code);
                    geoCache[host] = { code, flag };
                    return { code, flag };
                }
            } catch (e) {}
            return { code: '', flag: '' };
        }

        const geoCache = {};

        async function resolveBatch(hosts, concurrency = 10, progressCallback) {
            const uniqueHosts = [...new Set(hosts)];
            const results = {};
            let completed = 0;
            const total = uniqueHosts.length;

            async function worker() {
                while (uniqueHosts.length > 0) {
                    const host = uniqueHosts.shift();
                    if (!host) break;
                    const result = await resolveGeoIP(host);
                    results[host] = result;
                    completed++;
                    if (progressCallback) progressCallback(completed, total, host);
                    if (cancelRequested) break;
                }
            }

            const workers = [];
            const numWorkers = Math.min(concurrency, total);
            for (let i = 0; i < numWorkers; i++) {
                workers.push(worker());
            }
            await Promise.all(workers);
            return results;
        }

        // ===== Main Processing =====
        async function startProcessing() {
            if (isProcessing) {
                alert('Processing already in progress.');
                return;
            }
            const inputText = document.getElementById('inputText').value.trim();
            if (!inputText) {
                alert('No input provided.');
                return;
            }
            const lines = inputText.split('\n').filter(line => line.trim());
            if (lines.length === 0) return;

            isProcessing = true;
            isPaused = false;
            cancelRequested = false;
            processedCount = 0;
            totalCount = lines.length;
            startTime = Date.now();

            document.getElementById('runBtn').disabled = true;
            document.getElementById('pauseBtn').disabled = false;
            document.getElementById('cancelBtn').disabled = false;
            document.getElementById('pauseBtn').textContent = '⏸️ Pause';
            document.getElementById('outputText').value = '';
            document.getElementById('statsSummary').innerHTML = '';

            configs = [];

            const prefix = document.getElementById('prefix').value.trim();
            const startNum = parseInt(document.getElementById('startNum').value) || 0;
            const addTimestamp = document.getElementById('addTimestamp').checked;
            const addFlag = document.getElementById('addFlag').checked;
            const preserveCountry = document.getElementById('preserveCountry').checked;
            const countryPos = document.getElementById('countryPos').value;
            const dateFormat = document.getElementById('dateFormat').value;
            const removeDuplicates = document.getElementById('removeDuplicates').checked;
            const maxThreads = parseInt(document.getElementById('maxThreads').value) || 10;

            const seenLinks = new Set();
            const stats = { total: 0, renamed: 0, failed: 0, duplicates: 0, protocols: {}, countries: {} };
            const hostsToResolve = [];

            // Phase 1: Parse lines
            for (let i = 0; i < lines.length; i++) {
                if (cancelRequested) break;
                const link = lines[i].trim();
                const proto = getProtocolType(link);
                const cfg = {
                    original: link,
                    index: i,
                    protocol: proto,
                    host: extractHost(link),
                    oldName: getOldName(link),
                    newName: '',
                    country: '',
                    flag: '',
                    status: 'success',
                    errorMsg: ''
                };
                if (removeDuplicates && seenLinks.has(link.toLowerCase())) {
                    cfg.status = 'duplicate';
                    stats.duplicates++;
                    configs.push(cfg);
                    continue;
                }
                seenLinks.add(link.toLowerCase());
                stats.total++;
                stats.protocols[proto] = (stats.protocols[proto] || 0) + 1;
                configs.push(cfg);
                if (addFlag && cfg.host) hostsToResolve.push(cfg.host);
            }

            totalCount = configs.length;
            updateProgress(0, totalCount);

            // Phase 2: GeoIP resolution
            let geoResults = {};
            if (addFlag && hostsToResolve.length > 0) {
                updateStatus('Resolving country flags...');
                geoResults = await resolveBatch(hostsToResolve, maxThreads, (completed, total, host) => {
                    updateStatus(`GeoIP: ${completed}/${total} (${host})`);
                    if (cancelRequested) return;
                });
                for (const cfg of configs) {
                    if (cfg.host && geoResults[cfg.host]) {
                        cfg.country = geoResults[cfg.host].code;
                        cfg.flag = geoResults[cfg.host].flag;
                    }
                }
            }

            // Phase 3: Rename
            for (let i = 0; i < configs.length; i++) {
                while (isPaused && !cancelRequested) {
                    await new Promise(resolve => setTimeout(resolve, 200));
                }
                if (cancelRequested) break;

                const cfg = configs[i];
                if (cfg.status === 'duplicate') continue;

                let baseName = prefix ? `${prefix}${startNum + i}` : String(startNum + i);
                if (addTimestamp) {
                    const now = new Date();
                    const ts = formatDate(now, dateFormat);
                    baseName += `_${ts}`;
                }

                let newNameParts = [];
                let extracted = '';
                if (preserveCountry) {
                    extracted = extractCountryFlagFromName(cfg.oldName);
                    if (extracted && countryPos === 'prefix') newNameParts.push(extracted);
                }
                if (addFlag && cfg.flag) {
                    if (countryPos === 'prefix' && preserveCountry && extracted) {
                        // Avoid duplicate
                    } else {
                        newNameParts.push(cfg.flag);
                    }
                }
                newNameParts.push(baseName);
                if (preserveCountry && extracted && countryPos === 'suffix') newNameParts.push(extracted);
                if (addFlag && cfg.flag && countryPos !== 'prefix') newNameParts.push(cfg.flag);

                const newName = newNameParts.filter(p => p).join(' ');

                const renamedLink = renameLink(cfg.original, newName);
                if (renamedLink) {
                    cfg.renamed = renamedLink;
                    cfg.newName = newName;
                    cfg.status = 'success';
                    stats.renamed++;
                    if (cfg.flag) stats.countries[cfg.flag] = (stats.countries[cfg.flag] || 0) + 1;
                } else {
                    cfg.renamed = cfg.original + '  ⚠ (error)';
                    cfg.status = 'failed';
                    cfg.errorMsg = 'rename_failed';
                    stats.failed++;
                }

                processedCount++;
                updateProgress(processedCount, totalCount);
                if (processedCount % 10 === 0 || processedCount === totalCount) {
                    await new Promise(resolve => setTimeout(resolve, 0));
                }
                if (cancelRequested) break;
            }

            finishProcessing(configs, stats);
        }

        function updateProgress(done, total) {
            const percent = total > 0 ? Math.floor((done / total) * 100) : 0;
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressStats').textContent = `${percent}% (${done}/${total})`;
        }

        function finishProcessing(configs, stats) {
            isProcessing = false;
            isPaused = false;
            document.getElementById('runBtn').disabled = false;
            document.getElementById('pauseBtn').disabled = true;
            document.getElementById('cancelBtn').disabled = true;
            document.getElementById('pauseBtn').textContent = '⏸️ Pause';

            const outputText = configs.map(cfg => {
                if (cfg.status === 'duplicate') return cfg.original + '  ⚠ (duplicate)';
                return cfg.renamed || cfg.original + '  ⚠ (error)';
            }).join('\n');
            document.getElementById('outputText').value = outputText;

            // Build detailed summary with country grouping
            let summaryHtml = `<div><strong>Total configs:</strong> ${stats.total}</div>`;
            summaryHtml += `<div><strong>Successfully renamed:</strong> ${stats.renamed}</div>`;
            summaryHtml += `<div><strong>Failed:</strong> ${stats.failed}</div>`;
            summaryHtml += `<div><strong>Duplicates:</strong> ${stats.duplicates}</div>`;

            // Protocols
            if (Object.keys(stats.protocols).length > 0) {
                summaryHtml += `<div><strong>Protocols:</strong></div><ul>`;
                for (const [proto, count] of Object.entries(stats.protocols).sort()) {
                    summaryHtml += `<li>${proto}: ${count}</li>`;
                }
                summaryHtml += `</ul>`;
            }

            // Countries grouping
            if (Object.keys(stats.countries).length > 0) {
                summaryHtml += `<div><strong>Countries (by flag):</strong></div>`;
                const sortedCountries = Object.entries(stats.countries).sort((a,b) => b[1] - a[1]);
                summaryHtml += `<div class="country-group"><ul class="country-list">`;
                for (const [flag, count] of sortedCountries) {
                    // Get country name from flag if possible (optional)
                    summaryHtml += `<li><span>${flag}</span><span>${count} config(s)</span></li>`;
                }
                summaryHtml += `</ul></div>`;
            }

            document.getElementById('statsSummary').innerHTML = summaryHtml;
            log(`Processing completed: ${stats.total} configs processed.`);
            updateStatus(`Processing complete: ${stats.total} total, ${stats.renamed} renamed, ${stats.failed} failed, ${stats.duplicates} duplicates.`);
        }

        // ===== Output Export =====
        function exportOutput(format) {
            const output = document.getElementById('outputText').value;
            if (!output) {
                alert('Output is empty.');
                return;
            }
            let content = output;
            let mime = 'text/plain';
            let filename = 'configs';
            if (format === 'csv') {
                const lines = output.split('\n');
                let csv = 'index,link\n';
                lines.forEach((line, i) => {
                    csv += `${i+1},"${line.replace(/"/g, '""')}"\n`;
                });
                content = csv;
                mime = 'text/csv';
                filename += '.csv';
            } else if (format === 'json') {
                const lines = output.split('\n');
                const data = lines.map((line, i) => ({ index: i+1, link: line }));
                content = JSON.stringify(data, null, 2);
                mime = 'application/json';
                filename += '.json';
            } else {
                filename += '.txt';
            }
            const blob = new Blob([content], { type: mime });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            a.click();
            URL.revokeObjectURL(a.href);
            log(`Exported as ${format.toUpperCase()}.`);
        }

        function testGitHubConnection() {
            const token = document.getElementById('githubToken').value.trim();
            const repo = document.getElementById('githubRepo').value.trim();
            const path = document.getElementById('githubPath').value.trim();
            const branch = document.getElementById('githubBranch').value.trim();
            if (!token || !repo || !path || !branch) {
                document.getElementById('githubStatus').textContent = 'Please fill all fields.';
                return;
            }
            const apiUrl = `https://api.github.com/repos/${repo}/contents/${path}?ref=${branch}`;
            document.getElementById('githubStatus').textContent = 'Testing connection...';
            fetch(apiUrl, {
                headers: {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json'
                }
            })
            .then(res => {
                if (res.status === 200) return 'Connection successful. File exists.';
                if (res.status === 404) return 'Connection successful. File does not exist yet.';
                return `GitHub API error: ${res.status}`;
            })
            .then(msg => {
                document.getElementById('githubStatus').textContent = msg;
                log(msg);
            })
            .catch(err => {
                document.getElementById('githubStatus').textContent = 'Connection error: ' + err;
                log('GitHub test error: ' + err);

        async function uploadToGitHub() {
            const output = document.getElementById('outputText').value;
            if (!output) {
                alert('No output to upload.');
                return;
            }
            const token = document.getElementById('githubToken').value.trim();
            const repo = document.getElementById('githubRepo').value.trim();
            const path = document.getElementById('githubPath').value.trim();
            const branch = document.getElementById('githubBranch').value.trim();
            const mode = document.querySelector('input[name="uploadMode"]:checked').value;
            if (!token || !repo || !path || !branch) {
                alert('Please set GitHub token, repository, file path, and branch.');
                return;
            }

            const apiUrl = `https://api.github.com/repos/${repo}/contents/${path}`;
            const headers = {
                'Authorization': `token ${token}`,
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json'
            };

            try {
                let sha = null;
                let currentContent = '';
                const getResp = await fetch(`${apiUrl}?ref=${branch}`, { headers });
                if (getResp.status === 200) {
                    const data = await getResp.json();
                    sha = data.sha;
                    if (data.encoding === 'base64') {
                        currentContent = atob(data.content);
                    }
                } else if (getResp.status !== 404) {
                    throw new Error(`GitHub API error: ${getResp.status}`);
                }

                let finalContent = output;
                if (mode === 'prepend' && currentContent) {
                    finalContent = output + '\n' + currentContent;
                } else if (mode === 'append' && currentContent) {
                    finalContent = currentContent + '\n' + output;
                }

                const contentBase64 = btoa(unescape(encodeURIComponent(finalContent)));
                const payload = {
                    message: 'Update configs',
                    content: contentBase64,
                    branch: branch
                };
                if (sha) payload.sha = sha;

                const putResp = await fetch(apiUrl, {
                    method: 'PUT',
                    headers,
                    body: JSON.stringify(payload)
                });
                if (putResp.status === 200 || putResp.status === 201) {
                    alert('File uploaded successfully!');
                    log('GitHub upload successful.');
                } else {
                    throw new Error(`Upload failed: ${putResp.status} ${putResp.statusText}`);
                }
            } catch (err) {
                alert('Upload error: ' + err.message);
                log('GitHub upload error: ' + err.message);
            }
        }

            if (repo) document.getElementById('githubRepo').value = repo;
            const path = localStorage.getItem('githubPath');
            if (path) document.getElementById('githubPath').value = path;
            const branch = localStorage.getItem('githubBranch');
            if (branch) document.getElementById('githubBranch').value = branch;
            const maxThreads = localStorage.getItem('maxThreads');
            if (maxThreads) document.getElementById('maxThreads').value = maxThreads;
            const removeDuplicates = localStorage.getItem('removeDuplicates');
            if (removeDuplicates !== null) document.getElementById('removeDuplicates').checked = removeDuplicates === 'true';
        });

        console.log('V2Ray Config Renamer Pro Web Edition loaded.');
    </script>
